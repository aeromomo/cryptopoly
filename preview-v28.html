<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<title>CRYPTOPOLY v28 — Meme Sounds + Synthwave BG + LED Marquee</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05080F;
  --board-bg:rgba(8,12,22,.88);
  --cell-bg:rgba(14,20,32,.82);
  --accent:#14B8D3;--accent-2:#D45A9F;--accent-3:#F0C04E;
  --green:#2ED67A;--red:#E23B60;--gold:#F0C04E;
  --text:#DBE4F0;--text-dim:#6A7590;
  --border:rgba(14,165,194,.22);
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
canvas#kline{position:fixed;inset:0;z-index:0;opacity:.42}
body::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 55% 55% at 18% 22%,rgba(212,90,159,.13),transparent),radial-gradient(ellipse 55% 55% at 82% 78%,rgba(20,184,211,.13),transparent),radial-gradient(ellipse 30% 30% at 50% 50%,rgba(240,192,78,.08),transparent)}

/* === TOP STRIP === */
.top-strip{position:fixed;top:0;left:0;right:0;height:32px;z-index:100;background:rgba(5,8,15,.96);border-bottom:1px solid var(--accent-2);display:flex;align-items:center;padding:0 12px;font-family:Space Mono;font-size:10px;font-weight:700;overflow:hidden;backdrop-filter:blur(8px);gap:14px}
.brand{font-family:Bebas Neue;font-size:17px;letter-spacing:5px;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;flex-shrink:0;text-shadow:0 0 10px rgba(20,184,211,.3)}
.pulse-mini{display:flex;align-items:center;gap:5px;flex-shrink:0}
.pulse-mini span.l{color:#888;font-size:8.5px;letter-spacing:2px}
.pulse-mini .mb{width:72px;height:4px;background:rgba(20,20,30,.8);border-radius:2px;overflow:hidden;display:flex}
.pulse-mini .r-seg{flex:35;background:linear-gradient(90deg,transparent,var(--red))}
.pulse-mini .g-seg{flex:65;background:linear-gradient(90deg,var(--green),transparent)}
.pulse-mini .val{color:var(--green);text-shadow:0 0 5px var(--green);min-width:30px;font-size:10px;font-weight:700}
.feed{overflow:hidden;flex:1}
.feed-track{display:inline-flex;gap:28px;white-space:nowrap;animation:scroll 55s linear infinite;padding-left:100%}
@keyframes scroll{to{transform:translateX(-100%)}}
.up{color:var(--green);text-shadow:0 0 5px var(--green)}
.down{color:var(--red);text-shadow:0 0 5px var(--red)}
.gold{color:var(--gold);text-shadow:0 0 5px var(--gold)}

/* === LAYOUT: SIDEBAR + BOARD === */
.app{position:fixed;top:32px;bottom:0;left:0;right:0;display:grid;grid-template-columns:300px 1fr;gap:8px;padding:8px;z-index:10}
.sidebar{display:grid;grid-template-rows:1fr 1fr 1fr;gap:8px;min-height:0}
.panel{background:rgba(8,12,22,.78);backdrop-filter:blur(10px);border:1px solid var(--p-c,var(--accent));border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 18px rgba(20,184,211,.08),inset 0 0 30px rgba(0,0,0,.4)}
.panel.chat{--p-c:var(--accent)}
.panel.events{--p-c:var(--gold)}
.panel.markets{--p-c:var(--accent-2)}
.p-h{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;font-family:Bebas Neue;font-size:11px;letter-spacing:2.5px;color:var(--p-c);text-shadow:0 0 5px var(--p-c);flex-shrink:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.2))}
.p-h .tag{font-family:Space Mono;font-size:8px;padding:1.5px 5px;background:rgba(0,0,0,.5);border:1px solid currentColor;border-radius:3px;letter-spacing:.5px}
.p-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;gap:5px;min-height:0;font-family:Space Mono;font-size:11.5px}
.p-body::-webkit-scrollbar{width:4px}
.p-body::-webkit-scrollbar-thumb{background:rgba(20,184,211,.4);border-radius:2px}
.p-body-inner{display:flex;flex-direction:column;gap:5px}

/* CHAT messages */
.msg{display:flex;gap:6px;line-height:1.35;align-items:baseline;padding:1px 2px}
.msg .nm{font-family:Bebas Neue;font-size:11px;letter-spacing:.5px;color:var(--aura);text-shadow:0 0 4px var(--aura);flex-shrink:0;min-width:48px}
.msg .tx{color:#e8eef6;flex:1;font-size:11px}
.msg.trump{--aura:var(--gold)}.msg.elon{--aura:var(--accent)}.msg.cz{--aura:#D4AE39}.msg.vitalik{--aura:#8A46A6}
.msg.sys{--aura:var(--accent-2)}
.msg.sys .tx{color:var(--accent-2);font-style:italic;font-size:10.5px;text-shadow:0 0 3px var(--accent-2)}
.msg.skill{--aura:var(--gold);background:linear-gradient(90deg,rgba(240,192,78,.18),transparent);padding:2px 4px;border-radius:3px}
.msg.skill .tx{color:var(--gold);font-weight:700;text-shadow:0 0 4px var(--gold)}
.chat-input{padding:5px;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.45);flex-shrink:0}
.chat-input input{width:100%;background:rgba(0,0,0,.65);border:1px solid rgba(212,90,159,.4);color:#fff;padding:5px 8px;font-family:Space Mono;font-size:11px;border-radius:3px;outline:none}
.chat-input input:focus{border-color:var(--accent)}

/* EVENTS rows */
.evt{display:flex;align-items:center;gap:6px;padding:4px 6px;font-family:Space Mono;font-size:10px;line-height:1.3;border-left:3px solid var(--ec,var(--gold));background:rgba(0,0,0,.5);border-radius:3px}
.evt.rekt{--ec:var(--red)}.evt.moon{--ec:var(--green)}.evt.news{--ec:var(--gold)}.evt.tx{--ec:var(--accent)}.evt.kill{--ec:var(--red)}
.evt .ic{font-size:15px;flex-shrink:0;filter:drop-shadow(0 0 3px var(--ec))}
.evt .txt{flex:1;color:#f0f0f0}
.evt .txt b{color:var(--ec);text-shadow:0 0 3px var(--ec);font-weight:900}
.evt .time{font-size:8.5px;color:#777;flex-shrink:0}

/* MARKETS rows (price changes) */
.mkt{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;padding:3px 6px;font-family:Space Mono;font-size:11px;border-radius:3px;background:rgba(0,0,0,.4)}
.mkt .lg-mini{width:18px;height:18px;border-radius:50%;background:#222;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mkt .lg-mini img{width:100%;height:100%;object-fit:contain}
.mkt .nm{font-weight:700;color:#fff;font-size:10.5px}
.mkt .pr{color:#aaa;font-size:10px;font-weight:700}
.mkt .ch{font-size:10px;font-weight:700;padding:1px 4px;border-radius:2px}
.mkt .ch.up{color:var(--green);background:rgba(46,214,122,.14);text-shadow:0 0 3px var(--green)}
.mkt .ch.down{color:var(--red);background:rgba(226,59,96,.14);text-shadow:0 0 3px var(--red)}

/* === BOARD === */
.board-wrap{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.board{display:grid;grid-template-columns:1.5fr repeat(9,1fr) 1.5fr;grid-template-rows:1.5fr repeat(9,1fr) 1.5fr;width:min(96vh,100%);height:min(96vh,100%);max-width:1200px;max-height:1200px;gap:3px;padding:7px;background:var(--board-bg);backdrop-filter:blur(12px);border:2px solid var(--border);border-radius:14px;box-shadow:0 0 60px rgba(20,184,211,.2),0 0 120px rgba(212,90,159,.1),inset 0 0 60px rgba(0,0,0,.7);position:relative}

.c{background:var(--cell-bg);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.07);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 3px 3px;position:relative;overflow:hidden;transition:all .15s;min-width:0;min-height:0}
.c:hover{transform:translateY(-2px) scale(1.05);z-index:40;border-color:var(--brand,var(--accent));box-shadow:0 0 18px var(--brand,var(--accent))}
.c .top-stripe{position:absolute;top:0;left:0;right:0;height:3px;background:var(--brand);box-shadow:0 0 5px var(--brand)}
.c .lg{width:clamp(36px,5.6vh,72px);height:clamp(36px,5.6vh,72px);border-radius:50%;overflow:hidden;padding:2px;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(0,0,0,.4));flex-shrink:0;margin-top:5px;z-index:2;border:2px solid var(--brand);box-shadow:0 0 12px var(--brand),inset 0 0 8px rgba(255,255,255,.15)}
.c .lg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 5px var(--brand))}
.c .nm{font-family:Bebas Neue;font-size:clamp(8px,1.2vh,12px);color:#fff;line-height:1.1;letter-spacing:.7px;text-shadow:0 0 5px var(--brand);z-index:2;text-align:center;margin-top:4px}
.c .price-live{display:flex;align-items:center;gap:3px;z-index:2;margin-top:2px;font-family:Space Mono;font-weight:700;line-height:1}
.c .price-live .p{font-size:clamp(8px,1.05vh,11px);color:#fff}
.c .price-live .d{font-size:clamp(7px,.9vh,10px)}
.c .price-live .d.up{color:var(--green);text-shadow:0 0 4px var(--green)}
.c .price-live .d.down{color:var(--red);text-shadow:0 0 4px var(--red)}
.c .mini{position:absolute;bottom:1px;left:2px;right:2px;height:14px;opacity:.85;z-index:1}
.c .mini svg{width:100%;height:100%}
.c .own-dot{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:2px solid #000;z-index:3;box-shadow:0 0 7px currentColor;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue;font-size:12px;color:#000;font-weight:900;background:var(--owner-c)}
.c .lev-pill{position:absolute;top:3px;left:3px;background:var(--gold);color:#000;font-family:Bebas Neue;font-size:9px;padding:1.5px 4px;border-radius:3px;font-weight:900;z-index:3;line-height:1.2}
.c[data-tier="brown"]{--brand:#A97A44}.c[data-tier="lightblue"]{--brand:#3BB3D9}.c[data-tier="pink"]{--brand:#D04A81}.c[data-tier="orange"]{--brand:#DB8125}.c[data-tier="red"]{--brand:#D0475E}.c[data-tier="yellow"]{--brand:#D4AE39}.c[data-tier="green"]{--brand:#5AA86B}.c[data-tier="darkblue"]{--brand:var(--accent)}.c[data-tier="infra"]{--brand:var(--accent-2)}.c[data-tier="utility"]{--brand:#8A46A6}

/* === CORNER CELLS — 3x BIGGER LOGOS === */
.c.corner{background:radial-gradient(ellipse at center,rgba(26,38,54,.9),rgba(6,10,18,.95));border:2px solid var(--accent);justify-content:center;padding:6px 4px;position:relative}
.c.corner::before{content:"";position:absolute;inset:-2px;background:conic-gradient(from 0deg,var(--accent),transparent 50%,var(--accent));border-radius:6px;z-index:-1;filter:blur(6px);animation:spin 8s linear infinite;opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
.c.corner .ic{font-size:clamp(48px,7vh,82px);filter:drop-shadow(0 0 14px var(--accent)) drop-shadow(0 0 25px var(--accent));margin-bottom:6px;animation:corner-pulse 2.5s ease-in-out infinite}
@keyframes corner-pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 12px var(--accent)) drop-shadow(0 0 20px var(--accent))}50%{transform:scale(1.08);filter:drop-shadow(0 0 24px var(--accent)) drop-shadow(0 0 40px var(--accent))}}
.c.corner .nm{font-family:Bebas Neue;font-size:clamp(11px,1.6vh,17px);letter-spacing:1.5px;color:var(--accent);text-shadow:0 0 7px var(--accent)}
.c.corner .sub{font-size:clamp(8px,.9vh,11px);color:#9aa;letter-spacing:.8px;margin-top:3px}
.c.cwp{background:rgba(20,184,211,.22);border-color:var(--accent);justify-content:center}
.c.cal{background:rgba(212,90,159,.22);border-color:var(--accent-2);justify-content:center}
.c.ctx{background:rgba(219,129,37,.22);border-color:#DB8125;justify-content:center}

/* === CENTER STAGE — SIMPLIFIED === */
.stage{grid-column:2/11;grid-row:2/11;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,rgba(14,22,38,.7),rgba(3,5,10,.92));border:2px solid rgba(20,184,211,.3);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;box-shadow:inset 0 0 35px rgba(0,0,0,.6),0 0 25px rgba(20,184,211,.18)}
.stage::before{content:"";position:absolute;width:250%;height:250%;left:-75%;top:-75%;background:conic-gradient(from 0deg,transparent,rgba(20,184,211,.06),transparent,rgba(212,90,159,.06),transparent);animation:spin 60s linear infinite;pointer-events:none}
.stage::after{content:"";position:absolute;inset:6px;border:1px dashed rgba(240,192,78,.25);border-radius:5px;pointer-events:none;z-index:2}
.jojo-wrap{position:absolute;inset:0;z-index:3;pointer-events:none}
.jojo{position:absolute;width:clamp(64px,9vh,108px);height:clamp(64px,9vh,108px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue;font-size:clamp(32px,5vh,56px);font-weight:900;color:#fff;border:4px solid var(--aura);box-shadow:0 0 22px var(--aura),inset 0 0 14px rgba(0,0,0,.5);background:radial-gradient(circle,rgba(0,0,0,.6),rgba(0,0,0,.95));overflow:hidden}
.jojo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.jojo::before{content:"";position:absolute;inset:-18%;border-radius:50%;background:conic-gradient(from 0deg,var(--aura),transparent 50%,var(--aura));filter:blur(11px);z-index:-1;animation:spin 6s linear infinite;opacity:.6}
.jojo .ch{text-shadow:0 0 9px var(--aura);position:relative;z-index:2}
.jojo .mny{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-family:Space Mono;font-size:clamp(10px,1.3vh,13px);font-weight:700;color:var(--green);text-shadow:0 0 6px var(--green);background:rgba(0,0,0,.88);padding:2px 8px;border-radius:4px;white-space:nowrap;border:1.5px solid var(--aura);animation:money-pulse 2s ease-in-out infinite;z-index:5}
@keyframes money-pulse{0%,100%{text-shadow:0 0 3px currentColor}50%{text-shadow:0 0 8px currentColor,0 0 14px currentColor}}
.jojo.trump{--aura:var(--gold);top:6%;left:6%}
.jojo.elon{--aura:var(--accent);top:6%;right:6%}
.jojo.cz{--aura:#D4AE39;bottom:8%;left:6%}
.jojo.vitalik{--aura:#8A46A6;bottom:8%;right:6%}
.jojo.satoshi{--aura:var(--accent-2);top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(28px,4vh,42px);opacity:.65;width:clamp(54px,7.5vh,82px);height:clamp(54px,7.5vh,82px);animation:satoshi-breathe 4s ease-in-out infinite}
.jojo.vitalik .mny{color:var(--red);border-color:var(--red);text-shadow:0 0 6px var(--red)}
@keyframes satoshi-breathe{0%,100%{box-shadow:0 0 16px var(--aura),inset 0 0 12px rgba(0,0,0,.5)}50%{box-shadow:0 0 40px var(--aura),0 0 60px var(--aura),inset 0 0 12px rgba(0,0,0,.5)}}
.jojo.satoshi::after{content:"CREATOR";position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-family:Bebas Neue;font-size:9px;letter-spacing:2px;color:var(--accent-2);text-shadow:0 0 4px var(--accent-2);background:rgba(0,0,0,.8);padding:2px 6px;border-radius:3px;border:1px solid var(--accent-2)}

/* CENTER TITLE + ACTION — only essentials */
.center-zone{display:flex;flex-direction:column;align-items:center;gap:14px;z-index:5}
.center-title{font-family:Bebas Neue;font-size:clamp(28px,5.5vh,68px);letter-spacing:9px;color:#fff;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--gold),var(--accent));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gr 5s ease infinite;filter:drop-shadow(0 0 14px #000) drop-shadow(0 0 30px rgba(20,184,211,.5));text-align:center}
@keyframes gr{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.turn-info{font-family:Space Mono;font-size:11px;color:#888;letter-spacing:3px}

/* DICE + ACTION */
.dice-zone{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.7);padding:10px 18px;border-radius:8px;border:2px solid var(--gold);box-shadow:0 0 16px rgba(240,192,78,.4)}
.dice-zone .me{display:flex;align-items:center;gap:8px}
.me-avatar{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue;font-size:24px;color:#000;background:radial-gradient(circle,var(--gold),#C58E1A);border:3px solid var(--gold);box-shadow:0 0 14px var(--gold);font-weight:900;flex-shrink:0;overflow:hidden}
.me-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.me-info{display:flex;flex-direction:column}
.me-info .name{font-family:Bebas Neue;font-size:14px;letter-spacing:2px;color:var(--gold);text-shadow:0 0 4px var(--gold);line-height:1}
.me-info .money{font-family:Space Mono;font-size:13px;font-weight:700;color:var(--green);text-shadow:0 0 4px var(--green);margin-top:2px}
.dice-mini{display:flex;gap:6px;align-items:center}
.die-mini{width:36px;height:36px;background:linear-gradient(145deg,#fff 0%,#ddd 100%);color:#000;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue;font-size:25px;border-radius:5px;box-shadow:0 4px 0 #222,0 6px 10px rgba(0,0,0,.5);position:relative}
.die-mini.rolling{animation:die-roll .55s ease-out}
@keyframes die-roll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(180deg) scale(1.25)}50%{transform:rotate(360deg) scale(1.15)}75%{transform:rotate(540deg) scale(1.2)}100%{transform:rotate(720deg) scale(1)}}
.dice-mini .eq{color:var(--gold);font-family:Space Mono;font-size:14px;font-weight:700;text-shadow:0 0 4px var(--gold);min-width:30px}
.act-grid{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.act{font-family:Bebas Neue;font-size:11px;letter-spacing:1px;padding:7px 12px;border:2px solid #000;border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 #000;transition:all .1s;line-height:1}
.act:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000}
.act.roll{background:linear-gradient(135deg,var(--gold),#C58E1A);color:#000;font-size:14px;letter-spacing:3px;padding:9px 22px}
.act.pump{background:var(--green);color:#000}.act.dump{background:var(--red);color:#fff}.act.market{background:var(--accent);color:#000}.act.trade{background:var(--accent-2);color:#fff}.act.end{background:#555;color:#fff}

/* PUMP/DUMP cell anim */
.c.pumping{animation:pump-flash 1.4s ease-in-out infinite}
@keyframes pump-flash{0%,100%{box-shadow:inset 0 0 0 rgba(46,214,122,0),0 0 0 rgba(46,214,122,0)}50%{box-shadow:inset 0 0 18px rgba(46,214,122,.45),0 0 18px rgba(46,214,122,.55)}}
.c.dumping{animation:dump-flash 1.3s ease-in-out infinite}
@keyframes dump-flash{0%,100%{box-shadow:inset 0 0 0 rgba(226,59,96,0),0 0 0 rgba(226,59,96,0)}50%{box-shadow:inset 0 0 18px rgba(226,59,96,.5),0 0 22px rgba(226,59,96,.6)}}
.c .fx-badge{position:absolute;bottom:14px;right:1px;font-size:clamp(10px,1.3vh,14px);z-index:4;filter:drop-shadow(0 0 5px currentColor);animation:float-up 1.5s ease-in-out infinite;pointer-events:none}
.c.pumping .fx-badge{color:var(--green)}.c.dumping .fx-badge{color:var(--red)}
@keyframes float-up{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(-5px);opacity:1}}

/* CURRENT PLAYER */
.c.current-player{box-shadow:inset 0 0 0 3px var(--gold),0 0 30px rgba(240,192,78,.85);animation:cp-pulse 1.3s ease-in-out infinite;z-index:5;transform:scale(1.05)}
@keyframes cp-pulse{0%,100%{box-shadow:inset 0 0 0 2px var(--gold),0 0 18px rgba(240,192,78,.45)}50%{box-shadow:inset 0 0 0 2px var(--gold),0 0 32px rgba(240,192,78,.85)}}
.c.current-player::after{content:"🎩";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:22px;filter:drop-shadow(0 0 7px var(--gold));z-index:5}

/* PLAYER TOKENS ON CELLS */
.c .tokens{position:absolute;bottom:1px;right:1px;display:flex;gap:2px;z-index:5;flex-wrap:wrap;max-width:55%;justify-content:flex-end}
.c .tk{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue;font-size:10px;font-weight:900;color:#000;border:1.5px solid #000;background:var(--tk-c);box-shadow:0 0 7px var(--tk-c),inset 0 1px 0 rgba(255,255,255,.4);animation:tk-bob 1.4s ease-in-out infinite;position:relative}
.c.corner .tk{width:22px;height:22px;font-size:13px}

/* responsive: hide sidebar on small screens */

/* === v26 NEON CASINO ENHANCEMENT === */

/* === BRIGHTER PALETTE === */
:root{

body{background:radial-gradient(ellipse at top left,#0d0820,#05080F 60%) !important}

/* === BIGGER TITAN AVATARS (+30%) WITH NEON RINGS === */

/* Active turn glow on YOUR titan */
.jojo.active-turn{

.dice-zone{

  background:radial-gradient(ellipse at center,rgba(20,30,50,.78),rgba(3,5,10,.95)),repeating-conic-gradient(from 30deg,transparent 0deg 60deg,rgba(0,229,255,.05) 60deg 120deg,transparent 120deg 180deg) !important;

/* === v27 MONEY FLASH OVERLAY === */
.money-flash{

  animation:flash-overlay .9s ease-out forwards;

  100%{background:rgba(0,0,0,0)}
}
.money-flash.gain::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(0,255,136,.4),transparent 60%);
  animation:flash-bg-gain .9s ease-out forwards;
}
.money-flash.loss::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(255,46,92,.5),transparent 60%);

}
@keyframes flash-bg-gain{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes flash-bg-loss{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.money-flash .mf-text{
  font-family:Bebas Neue;
  font-size:clamp(80px,18vh,200px);
  letter-spacing:6px;
  font-weight:900;
  text-shadow:0 0 30px currentColor,0 0 60px currentColor,0 6px 0 #000;

  filter:drop-shadow(0 8px 20px rgba(0,0,0,.7));
}
.money-flash.gain .mf-text{color:#00FF88}
.money-flash.loss .mf-text{color:#FF2E5C}
@keyframes mf-zoom{
  0%{opacity:0;transform:scale(.3) rotate(-15deg)}
  20%{opacity:1;transform:scale(1.2) rotate(3deg)}
  35%{transform:scale(1) rotate(0)}
  85%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(.95) translateY(-30px)}
}
.money-flash .mf-sub{
  position:absolute;
  bottom:25%;left:50%;transform:translateX(-50%);
  font-family:Bebas Neue;font-size:24px;letter-spacing:6px;
  color:#fff;text-shadow:0 0 12px #000;

function placeTokens(){
  document.querySelectorAll(".c .tokens").forEach(e=>e.remove());
  const byCell={};
  Object.entries(STATE.positions).forEach(([pid,pos])=>{(byCell[pos]=byCell[pos]||[]).push(pid)});
  Object.entries(byCell).forEach(([pos,pids])=>{
    const cell=document.querySelector(`[data-pos="${pos}"]`);if(!cell)return;
    const wrap=document.createElement("div");wrap.className="tokens";
    pids.forEach(pid=>{const p=getP(pid);if(!p)return;const tk=document.createElement("div");tk.className="tk"+(pid===MY_SEAT?" me":"");tk.style.setProperty("--tk-c",p.aura);tk.textContent=p.initial;wrap.appendChild(tk)});
    cell.appendChild(wrap);
  });
}
function showCard(card,deck){
  const m=document.createElement("div");m.className="card-modal";
  m.innerHTML=`<div class="card-mo" style="--card-c:${card.c}"><div class="card-h"><span class="ic">${card.ic}</span>${deck} · ${card.h}</div><div class="card-t">${card.t}</div><div class="card-d">${card.d}</div><div class="card-fx">${card.fx}</div><div class="card-btns"><button class="card-btn go">ACCEPT FATE</button><button class="card-btn skip">SKIP (PAY $50)</button></div></div>`;

function rollDice(){
  if(!isMyTurn())return addToast("⏳ NOT YOUR TURN");
  const a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1,steps=a+b;
  const dice=document.querySelectorAll(".die-mini");
  dice.forEach(d=>d.classList.add("rolling"));
  const eq=document.querySelector(".dice-mini .eq");
  let n=0;const tick=setInterval(()=>{
    if(dice[0])dice[0].textContent="⚀⚁⚂⚃⚄⚅"[Math.floor(Math.random()*6)];
    if(dice[1])dice[1].textContent="⚀⚁⚂⚃⚄⚅"[Math.floor(Math.random()*6)];
    if(eq)eq.textContent="= ?";
    if(++n>4){clearInterval(tick);
      if(dice[0])dice[0].textContent="⚀⚁⚂⚃⚄⚅"[a-1];
      if(dice[1])dice[1].textContent="⚀⚁⚂⚃⚄⚅"[b-1];
      if(eq)eq.textContent="= "+steps;
      dice.forEach(d=>d.classList.remove("rolling"));
      window.__broadcast&&window.__broadcast({type:"ROLL",steps});
      movePlayer(MY_SEAT,steps);
    }
  },80);
}
function movePlayer(pid,steps){
  const cur=STATE.positions[pid];let i=0;
  const it=setInterval(()=>{
    const next=(cur+(++i))%40;
    document.querySelectorAll(".c.current-player").forEach(c=>c.classList.remove("current-player"));
    STATE.positions[pid]=next;placeTokens();
    const cell=document.querySelector(`[data-pos="${next}"]`);
    if(cell){cell.classList.add("move-trail");setTimeout(()=>cell.classList.remove("move-trail"),600);if(i===steps)cell.classList.add("current-player")}
    if(i>=steps){clearInterval(it);window.__broadcast&&window.__broadcast({type:"LAND",pos:next,player:pid});landOn(next,pid)}
  },280);
}
function landOn(pos,pid){
  const sq=SQ[pos];if(!sq)return;
  setTimeout(()=>{
    if(sq.t==="wp"){showCard(rng(WP_CARDS),"WHITE PAPER")}
    else if(sq.t==="al"){showCard(rng(AL_CARDS),"ALPHA")}
    else if(sq.t==="tx"){showCard({ic:sq.ic,h:"TAX",t:sq.n,d:"You owe the network. Standard fee.",fx:sq.d,c:"#DB8125"},"TAX")}
    else if(sq.t==="go"){addToast("✈️ COLLECT $200")}
    else if(sq.t==="jail"){showCard({ic:"🏛",h:"REGULATORY",t:"SEC LOCK-UP",d:"Found your txns. Frozen.",fx:"skip 1 turn",c:"#E23B60"},"JAIL")}
    else if(sq.t==="gj"){showCard({ic:"🚨",h:"ENFORCEMENT",t:"CFTC RAID",d:"Off to SEC island.",fx:"go to JAIL",c:"#E23B60"},"GO TO JAIL")}
    else if(sq.t==="pk"){addToast("💎 HODL LOUNGE · vibe")}
    // rent
    if(sq.t==="p"&&OWNED[pos]&&OWNED[pos].owner!==pid){
      const ow=OWNED[pos];const lev=ow.lev||1;const baseRent=Math.floor((sq.price||100)*0.1)*([1,2,5,10,25,100][lev]||1);
      payRent(pid,ow.owner,baseRent,sq.n);
    }
  },350);
}
function payRent(payer,owner,amount,propName){
  const pp=getP(payer),op=getP(owner);if(!pp||!op)return;
  pp.money-=amount;op.money+=amount;
  if(pp.money<=0){pp.rekt=true;pp.money=0;sysChat(`💀 ${pp.name} LIQUIDATED by ${op.name}`);eventAdd("kill","💀",`<b>${op.name}</b> rekt <b>${pp.name}</b>`)}
  else{sysChat(`💸 ${pp.name} paid $${amount} to ${op.name}`);eventAdd("tx","💸",`<b>${pp.name}</b> → ${op.name} $${amount} rent`)}
  refreshWalletAndTitans();checkWin();
}
function refreshWalletAndTitans(){
  const map={p1:"trump",p2:"elon",p3:"cz",p4:"vitalik"};

    const j=document.querySelector(`.jojo.${map[p.id]} .mny`);
    if(j)j.textContent=p.rekt?"REKT":"$"+(p.money>=1000?(p.money/1000).toFixed(1)+"k":p.money);

const BOT_LINES={p2:["doge to moon 🚀","ngmi","rigged 🤡","based","🚀🚀🚀","optimistic"],p3:["4","WAGMI","follow our progress","take profits","SAFU"],p4:["gm. inefficient.","stake more","blockspace","l2 endgame","trustless","gm."]};

function botMove(pid,onDone){
  const a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1,steps=a+b;
  sysChat(`🎲 ${getP(pid).name} rolled ${a}+${b}=${steps}`);
  let i=0;const cur=STATE.positions[pid];
  const it=setInterval(()=>{
    const next=(cur+(++i))%40;STATE.positions[pid]=next;placeTokens();
    const cell=document.querySelector(`[data-pos="${next}"]`);
    if(cell){cell.classList.add("move-trail");setTimeout(()=>cell.classList.remove("move-trail"),600)}
    if(i>=steps){clearInterval(it);
      const land=SQ[STATE.positions[pid]];botLand(pid,land);
      setTimeout(()=>onDone&&onDone(),1100);
    }
  },220);
}
function botLand(pid,sq){
  if(!sq)return;
  const lines=BOT_LINES[pid];const phrase=lines[Math.floor(Math.random()*lines.length)];
  setTimeout(()=>chatAdd(BOT_CLS[pid],getP(pid).name,phrase),250);
  if(sq.t==="wp"){const c=rng(WP_CARDS);eventAdd("news",c.ic,`<b>${getP(pid).name}</b> drew ${c.t} · ${c.fx}`)}
  else if(sq.t==="al"){const c=rng(AL_CARDS);eventAdd("moon",c.ic,`<b>${getP(pid).name}</b> drew ${c.t}`)}
  else if(sq.t==="p"&&sq.price&&!OWNED[sq.id]&&Math.random()<.45){
    OWNED[sq.id]={owner:pid,lev:1};redrawCell(sq.id);
    sysChat(`💰 ${getP(pid).name} bought ${sq.n} $${sq.price}`);
    eventAdd("tx","💰",`<b>${getP(pid).name}</b> bought <b>${sq.n}</b> $${sq.price}`);
  }
}
function redrawCell(id){
  const cell=document.querySelector(`[data-pos="${id}"]`);if(!cell)return;
  const ow=OWNED[id];if(!ow)return;const p=getP(ow.owner);if(!p)return;
  let dot=cell.querySelector(".own-dot");
  if(!dot){dot=document.createElement("div");dot.className="own-dot";cell.appendChild(dot)}
  dot.style.setProperty("--owner-c",p.aura);dot.style.color=p.aura;dot.textContent=p.initial;
}
async function runBotTurns(){
  for(const pid of ["p2","p3","p4"]){
    if(getP(pid)?.rekt)continue;
    if(SEATS_TAKEN.has(pid))continue; // human controls this seat
    await new Promise(r=>setTimeout(()=>botMove(pid,r),700));
  }
  STATE.turn++;document.getElementById("turn-info").textContent="DEGEN CASINO · TURN "+STATE.turn;
  sysChat(`▶ TURN ${STATE.turn} · YOUR ROLL`);
}

const URL_PARAMS=new URLSearchParams(location.search);

const MY_SEAT=URL_PARAMS.get("seat")||"p1";

const SEATS_TAKEN=new Set([MY_SEAT]);

const channel=new BroadcastChannel("cryptopoly-"+GAME_ID);
window.__broadcast=function(action){
  if(action.type==="STATE_SYNC")action.seats=Array.from(SEATS_TAKEN);
  channel.postMessage({action,from:MY_SEAT,t:Date.now()});
};
channel.onmessage=function(e){
  const{action:a,from}=e.data;if(from===MY_SEAT)return;
  SEATS_TAKEN.add(from);updateSeatBadge();
  if(a.type==="HELLO"){
    channel.postMessage({action:{type:"STATE_SYNC",positions:STATE.positions,turn:STATE.turn,owned:OWNED,mode:GAME_MODE,seats:Array.from(SEATS_TAKEN)},from:MY_SEAT});
  }else if(a.type==="STATE_SYNC"){
    Object.assign(STATE.positions,a.positions||{});STATE.turn=a.turn||STATE.turn;Object.assign(OWNED,a.owned||{});placeTokens();
    if(a.seats)a.seats.forEach(s=>SEATS_TAKEN.add(s));updateSeatBadge();updateModeBadge();
    document.getElementById("turn-info").textContent="DEGEN CASINO · TURN "+STATE.turn;
  }else if(a.type==="ROLL"){sysChat(`🎲 ${getP(from).name} rolling...`)}
  else if(a.type==="LAND"){STATE.positions[from]=a.pos;placeTokens();sysChat(`📍 ${getP(from).name} → ${SQ[a.pos].n}`)}
  else if(a.type==="BUY"){OWNED[a.pos]={owner:a.player,lev:a.lev||1};redrawCell(a.pos);sysChat(`💰 ${getP(a.player).name} bought ${SQ[a.pos].n}`)}
  else if(a.type==="CHAT"){chatAdd(BOT_CLS[from]||"trump",getP(from)?.name||from,a.text)}
  else if(a.type==="MODE"){GAME_MODE=a.mode;updateModeBadge()}
  else if(a.type==="END_TURN"){STATE.turn++;document.getElementById("turn-info").textContent="DEGEN CASINO · TURN "+STATE.turn}
};

function dumpCoin(id){

/* Live market ticker — tick prices every 3-5s */
const TICKER_INTERVAL=3500;
function liveTick(){
  const props=SQ.filter(s=>(s.t==="p"||s.t==="infra"||s.t==="u")&&s.price);
  // Pick 1-3 random props each tick
  const picks=[];const n=1+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++)picks.push(props[Math.floor(Math.random()*props.length)]);
  picks.forEach(sq=>{
    const dir=Math.random()<.5?"up":"down";const pct=(Math.random()*8+0.5).toFixed(1);
    const oldPrice=sq.price;
    const newPrice=dir==="up"?Math.floor(oldPrice*(1+pct/100)):Math.max(10,Math.floor(oldPrice*(1-pct/100)));
    sq.price=newPrice;sq.dir=dir;sq.change=`${dir==="up"?"+":"-"}${pct}%`;
    const cell=document.querySelector(`[data-pos="${sq.id}"]`);
    if(!cell)return;
    const pe=cell.querySelector(".price-live .p");if(pe){
      pe.textContent=`$${newPrice}`;
      pe.style.transition="color .3s";pe.style.color=dir==="up"?"#2ED67A":"#E23B60";
      setTimeout(()=>pe.style.color="",800);
    }
    const de=cell.querySelector(".price-live .d");if(de){
      de.textContent=sq.change;de.className="d "+dir;
    }
    // animate brief flash on cell
    cell.style.transition="box-shadow .4s";
    cell.style.boxShadow=`0 0 14px ${dir==="up"?"rgba(46,214,122,.5)":"rgba(226,59,96,.5)"}`;
    setTimeout(()=>cell.style.boxShadow="",600);
    // add to markets panel
    if(typeof marketAdd==="function")marketAdd(sq,dir,sq.change);
    // major moves trigger event
    if(parseFloat(pct)>=5){
      eventAdd(dir==="up"?"moon":"rekt",dir==="up"?"📈":"📉",`<b>${sq.n}</b> ${sq.change} (live)`);
    }
  });
  // pulse market badge
  const pulseVal=document.querySelector(".pulse-mini .val");if(pulseVal){
    const v=picks.filter(p=>p.dir==="up").length-picks.filter(p=>p.dir==="down").length;
    const cur=parseInt(pulseVal.textContent.replace(/[^-\d]/g,""))||0;
    const next=Math.max(-100,Math.min(100,cur+v*5+(Math.random()<.5?1:-1)));
    pulseVal.textContent=(next>=0?"+":"")+next;
    pulseVal.style.color=next>=0?"#2ED67A":"#E23B60";
  }
}
let _liveTickId=setInterval(liveTick,TICKER_INTERVAL);

function openAuction(sq,pos){

  if(!bidders.length){addToast("🪦 NO BIDDERS · PROPERTY UNCLAIMED");return}

  const bids={};let topBid=0;let topBidder=null;const minBid=Math.floor(sq.price*.5);const maxRand=Math.floor(sq.price*1.4);

/* Pass-through GO → +$200 toast */
const _origMove2=window.movePlayer;
window.movePlayer=function(pid,steps){
  const cur=STATE.positions[pid];let i=0;
  let crossedGo=false;
  const it=setInterval(()=>{
    const next=(cur+(++i))%40;
    if(next===0&&i<steps){crossedGo=true}
    document.querySelectorAll(".c.current-player").forEach(c=>c.classList.remove("current-player"));
    STATE.positions[pid]=next;placeTokens();
    const cell=document.querySelector(`[data-pos="${next}"]`);
    if(cell){cell.classList.add("move-trail");setTimeout(()=>cell.classList.remove("move-trail"),600);if(i===steps)cell.classList.add("current-player")}
    if(i>=steps){clearInterval(it);
      if(crossedGo){
        const me=getP(pid);if(me){me.money+=200;refreshWalletAndTitans();
          if(pid===MY_SEAT)addToast("✈️ PASS GO · +$200");
          eventAdd("moon","✈️",`<b>${getP(pid).name}</b> passed GO · +$200`);
        }
      }
      window.__broadcast({type:"LAND",pos:next,player:pid});
      (window.landOn||landOn)(next,pid);
    }

/* Sound effects via Web Audio API */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function tone(freq,dur,type="sine",vol=0.06){
  try{
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

async function playerTurn(){
  if(window.__turnLocked)return;
  setTurnLock(true,"🎲 ROLLING...");
  // Roll dice
  const a=Math.floor(Math.random()*6)+1,b=Math.floor(Math.random()*6)+1,steps=a+b;
  const dice=document.querySelectorAll(".die-mini");
  dice.forEach(d=>d.classList.add("rolling"));
  await delay(150);
  for(let i=0;i<5;i++){
    if(dice[0])dice[0].textContent="⚀⚁⚂⚃⚄⚅"[Math.floor(Math.random()*6)];
    if(dice[1])dice[1].textContent="⚀⚁⚂⚃⚄⚅"[Math.floor(Math.random()*6)];
    await delay(80);
  }
  if(dice[0])dice[0].textContent="⚀⚁⚂⚃⚄⚅"[a-1];
  if(dice[1])dice[1].textContent="⚀⚁⚂⚃⚄⚅"[b-1];
  const eq=document.querySelector(".dice-mini .eq");if(eq)eq.textContent="= "+steps;
  dice.forEach(d=>d.classList.remove("rolling"));

  const me=getP(MY_SEAT);
  eventAddNew("news","🎲",`<b>${me.name}</b> rolled ${a}+${b}=<b>${steps}</b>`);
  if(typeof window.__broadcast==="function")window.__broadcast({type:"ROLL",steps});

  // Move
  showTurnStatus(`🚶 MOVING ${steps} STEPS...`);
  await animateMove(MY_SEAT,steps);

  // Land sequence
  showTurnStatus("🎯 RESOLVING...");
  await landSequence(MY_SEAT);

  // Bot turns
  for(const pid of ["p2","p3","p4"]){
    if(getP(pid)?.rekt)continue;
    if(SEATS_TAKEN.has(pid)&&pid!=="p1")continue; // human controls
    if(GAME_MODE!=="solo"&&!SEATS_TAKEN.has(pid))continue;
    if(GAME_MODE!=="solo")continue;
    showTurnStatus(`🤖 ${getP(pid).name} TURN`);
    await delay(700);
    await botTurn(pid);
  }

  // End turn
  STATE.turn++;
  document.getElementById("turn-info").textContent="DEGEN CASINO · TURN "+STATE.turn;
  eventAddNew("news","▶",`TURN ${STATE.turn} · YOUR ROLL`);

async function animateMove(pid,steps){
  const cur=STATE.positions[pid];let i=0;
  let crossedGo=false;
  while(i<steps){
    i++;
    const next=(cur+i)%40;
    if(next===0&&i<steps)crossedGo=true;
    if(next===0)crossedGo=true;
    document.querySelectorAll(".c.current-player").forEach(c=>c.classList.remove("current-player"));
    STATE.positions[pid]=next;placeTokens();
    const cell=document.querySelector(`[data-pos="${next}"]`);
    if(cell){
      cell.classList.add("move-trail");
      setTimeout(()=>cell.classList.remove("move-trail"),600);
      if(i===steps)cell.classList.add("current-player");
    }
    await delay(280);
  }
  // pass go bonus
  if(crossedGo){
    const me=getP(pid);if(me){
      me.money+=200;
      if(typeof refreshWalletAndTitans==="function")refreshWalletAndTitans();
      eventAddNew("moon","✈️",`<b>${me.name}</b> passed GO · +$200`);
      if(pid===MY_SEAT)flashMoney(200,"PASS GO");

}

let _audioInitialized=false;
let _audioCtx=null;
let _masterGain=null;
let _musicGain=null;
let _sfxGain=null;
window.SOUND_ON=true;
window.MUSIC_ON=true;

function initAudio(){
  if(_audioInitialized)return;
  try{
    _audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    _masterGain=_audioCtx.createGain();_masterGain.gain.value=.4;_masterGain.connect(_audioCtx.destination);
    _musicGain=_audioCtx.createGain();_musicGain.gain.value=.18;_musicGain.connect(_masterGain);
    _sfxGain=_audioCtx.createGain();_sfxGain.gain.value=.55;_sfxGain.connect(_masterGain);
    _audioInitialized=true;
    startSynthwaveLoop();
  }catch(e){console.warn("audio init failed",e)}
}

/* SFX HELPERS */
function osc(freq,dur,type="sine",vol=1,delay=0,detune=0){
  if(!_audioInitialized||!window.SOUND_ON)return;
  const t=_audioCtx.currentTime+delay;
  const o=_audioCtx.createOscillator();const g=_audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(detune)o.detune.value=detune;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(_sfxGain);
  o.start(t);o.stop(t+dur+0.01);
}
function sweep(f1,f2,dur,type="sawtooth",vol=.8){
  if(!_audioInitialized||!window.SOUND_ON)return;
  const t=_audioCtx.currentTime;
  const o=_audioCtx.createOscillator();const g=_audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(_sfxGain);
  o.start(t);o.stop(t+dur+0.01);
}
function noise(dur,vol=.5,filterType="lowpass",filterFreq=2000){
  if(!_audioInitialized||!window.SOUND_ON)return;
  const t=_audioCtx.currentTime;
  const buf=_audioCtx.createBuffer(1,_audioCtx.sampleRate*dur,_audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*5);
  const src=_audioCtx.createBufferSource();src.buffer=buf;
  const filt=_audioCtx.createBiquadFilter();filt.type=filterType;filt.frequency.value=filterFreq;
  const g=_audioCtx.createGain();g.gain.value=vol;
  src.connect(filt);filt.connect(g);g.connect(_sfxGain);
  src.start(t);
}

/* === SYNTHWAVE BG LOOP === */
function startSynthwaveLoop(){
  if(!_audioInitialized||!window.MUSIC_ON)return;
  // Cm - Ab - Eb - Bb (i - VI - III - VII) classic synthwave
  const chords=[
    {root:130.81,notes:[130.81,155.56,196.00,233.08]}, // Cm
    {root:103.83,notes:[103.83,130.81,155.56,207.65]}, // Ab
    {root:155.56,notes:[155.56,196.00,233.08,311.13]}, // Eb
    {root:116.54,notes:[116.54,146.83,185.00,233.08]}  // Bb
  ];
  const beatLen=.42; // each beat
  const barLen=beatLen*4; // 4 beats/bar
  let bar=0;
  function scheduleNext(){
    if(!window.MUSIC_ON||!_audioInitialized)return;
    const c=chords[bar%4];
    const t=_audioCtx.currentTime;
    // BASS — sub root quarter notes
    for(let i=0;i<4;i++){
      const o=_audioCtx.createOscillator();const g=_audioCtx.createGain();
      o.type="sawtooth";o.frequency.value=c.root/2;
      const lp=_audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=400;lp.Q.value=4;
      g.gain.setValueAtTime(0,t+i*beatLen);
      g.gain.linearRampToValueAtTime(.42,t+i*beatLen+.01);
      g.gain.linearRampToValueAtTime(0,t+i*beatLen+beatLen*.7);
      o.connect(lp);lp.connect(g);g.connect(_musicGain);
      o.start(t+i*beatLen);o.stop(t+i*beatLen+beatLen);
    }
    // PAD — chord every bar (long sustain)
    c.notes.forEach((n,i)=>{
      const o=_audioCtx.createOscillator();const g=_audioCtx.createGain();
      o.type="triangle";o.frequency.value=n;o.detune.value=(i%2===0?-7:7);
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.06,t+.5);
      g.gain.linearRampToValueAtTime(0,t+barLen-.05);
      o.connect(g);g.connect(_musicGain);
      o.start(t);o.stop(t+barLen);
    });
    // SECOND PAD layer — octave up
    const padHi=_audioCtx.createOscillator();const padHiG=_audioCtx.createGain();
    padHi.type="sine";padHi.frequency.value=c.notes[2]*2;padHi.detune.value=5;
    padHiG.gain.setValueAtTime(0,t);
    padHiG.gain.linearRampToValueAtTime(.04,t+.4);
    padHiG.gain.linearRampToValueAtTime(0,t+barLen-.05);
    padHi.connect(padHiG);padHiG.connect(_musicGain);
    padHi.start(t);padHi.stop(t+barLen);
    // HI-HAT — every 8th
    for(let i=0;i<8;i++){
      const buf=_audioCtx.createBuffer(1,_audioCtx.sampleRate*.04,_audioCtx.sampleRate);
      const d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.exp(-j/d.length*6);
      const src=_audioCtx.createBufferSource();src.buffer=buf;
      const hp=_audioCtx.createBiquadFilter();hp.type="highpass";hp.frequency.value=8000;
      const g=_audioCtx.createGain();g.gain.value=i%2?.04:.06;
      src.connect(hp);hp.connect(g);g.connect(_musicGain);
      src.start(t+i*beatLen/2);
    }
    // LEAD melody — sparse
    if(bar%2===0){
      const mel=[c.notes[2],c.notes[3],c.notes[2]*2];
      mel.forEach((m,i)=>{
        const o=_audioCtx.createOscillator();const g=_audioCtx.createGain();
        o.type="sawtooth";o.frequency.value=m;o.detune.value=-3;
        const lp=_audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
        g.gain.setValueAtTime(0,t+i*beatLen);
        g.gain.linearRampToValueAtTime(.07,t+i*beatLen+.02);
        g.gain.linearRampToValueAtTime(0,t+i*beatLen+beatLen*.8);
        o.connect(lp);lp.connect(g);g.connect(_musicGain);
        o.start(t+i*beatLen);o.stop(t+i*beatLen+beatLen);
      });
    }
    bar++;
    setTimeout(scheduleNext,barLen*1000-50);
  }
  scheduleNext();
}

// Listen for events panel additions and play themed sounds
const evtsObs=new MutationObserver(records=>{
  records.forEach(r=>{
    r.addedNodes.forEach(n=>{
      if(!n.classList||!n.classList.contains("evt"))return;
      const t=n.textContent.toLowerCase();
      if(t.includes("rekt")||t.includes("liquidat"))setTimeout(SFX.rekt,50);
      else if(t.includes("hack"))setTimeout(SFX.hack,50);
      else if(t.includes("airdrop"))setTimeout(SFX.airdrop,50);
      else if(t.includes("rent"))setTimeout(SFX.rent,50);
      else if(t.includes("tax")||t.includes("⛽"))setTimeout(SFX.payTax,50);
      else if(t.includes("bought"))setTimeout(SFX.buy,50);
      else if(t.includes("pump"))setTimeout(SFX.pump,50);
      else if(t.includes("dump"))setTimeout(SFX.dump,50);
      else if(t.includes("pass go")||t.includes("passed go"))setTimeout(SFX.passGo,50);
      else if(t.includes("auction"))setTimeout(SFX.auction,50);
      else if(t.includes("activated")||t.includes("skill"))setTimeout(SFX.skillActivate,50);
      else if(t.includes("drew"))setTimeout(SFX.cardPop,50);
    });
  });
});
setTimeout(()=>{
  const evtsInner=document.getElementById("events-inner");
  if(evtsInner)evtsObs.observe(evtsInner,{childList:true});
},500);

/* === SOUND TOGGLE BUTTON === */
function injectSoundToggle(){
  const top=document.querySelector(".top-strip");if(!top)return;
  const btn=document.createElement("button");
  btn.id="sound-toggle";
  btn.style.cssText="background:rgba(0,0,0,.6);border:1.5px solid var(--gold);color:var(--gold);font-family:Bebas Neue;letter-spacing:2px;padding:5px 10px;font-size:11px;border-radius:4px;cursor:pointer;flex-shrink:0;text-shadow:0 0 4px var(--gold)";
  function update(){btn.textContent=window.MUSIC_ON?"🎵 MUSIC ON":"🔇 MUSIC OFF"}
  update();
  btn.onclick=()=>{
    ensureAudio();
    window.MUSIC_ON=!window.MUSIC_ON;
    if(_musicGain)_musicGain.gain.value=window.MUSIC_ON?.18:0;
    update();
  };
  top.insertBefore(btn,top.querySelector("#invite-btn"));

  const sbtn=document.createElement("button");
  sbtn.id="sfx-toggle";
  sbtn.style.cssText="background:rgba(0,0,0,.6);border:1.5px solid var(--accent);color:var(--accent);font-family:Bebas Neue;letter-spacing:2px;padding:5px 10px;font-size:11px;border-radius:4px;cursor:pointer;flex-shrink:0;text-shadow:0 0 4px var(--accent);margin-right:6px";
  function updateSfx(){sbtn.textContent=window.SOUND_ON?"🔊 SFX ON":"🔇 SFX OFF"}
  updateSfx();
  sbtn.onclick=()=>{
    ensureAudio();
    window.SOUND_ON=!window.SOUND_ON;
    updateSfx();
  };
  top.insertBefore(sbtn,btn);
}
setTimeout(injectSoundToggle,400);
